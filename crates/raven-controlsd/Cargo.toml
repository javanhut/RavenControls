[package]
name = "raven-controlsd"
description = "Privileged fan and backlight daemon for RavenControls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "raven_controlsd"
path = "src/lib.rs"

[[bin]]
name = "raven-controlsd"
path = "src/main.rs"

[dependencies]
raven-hw.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only for turning SIGTERM and SIGINT into an ordinary event on a thread, so
# the fans get handed back on a clean shutdown. Nothing else needs a C library.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
